name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/g.zip
          sudo unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: unzip -q UltramanBattle.zip -d proj

      - name: Build Debug APK
        run: cd proj/UltramanBattle && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ultraman-battle-apk
          path: proj/UltramanBattle/app/build/outputs/apk/debug/*.apk
